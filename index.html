<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WORKPLAN — Kampus Planner</title>
  <meta name="description" content="Catatan kerja harian, hari penting kampus, dan projek/event admin media sosial — tersinkron ke Google Kalender.">
  <meta name="theme-color" content="#2F6BFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Workplan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/icons.js"></script>
  <script defer src="js/stat.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/pages.js"></script>
  <script defer src="js/modules.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="splash" id="splash" role="status" aria-live="polite">
    <div style="text-align:center">
      <div class="brand-logo"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <b style="font-size:22px">WORKPLAN</b>
      <div class="muted small" id="splash-msg">Menyiapkan ruang kerja…</div>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu utama"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <header class="appbar" id="appbar"></header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <nav class="bottomnav" id="bottomnav" aria-label="Navigasi bawah"></nav>
  <button class="fab" id="fab" hidden aria-label="Tambah catatan baru"></button>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">WORKPLAN membutuhkan JavaScript. Aktifkan JavaScript di peramban Anda.</p></noscript>
</body>
</html>
